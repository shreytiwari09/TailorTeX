services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: tailortex
      POSTGRES_PASSWORD: tailortex
      POSTGRES_DB: tailortex
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tailortex-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tailortex"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  tailortex:
    build: .
    image: tailortex
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    # These win over .env, which is written for running on the host (relative data folder, local TeX)
    environment:
      DATABASE_URL: postgresql+asyncpg://tailortex:tailortex@db:5432/tailortex
      TAILORTEX_DATA_DIR: /data
      TAILORTEX_TEX_AUTOINSTALL: "0"
      TAILORTEX_TEX_BIN: ""
    volumes:
      - tailortex-data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tailortex-data:
  tailortex-db:
