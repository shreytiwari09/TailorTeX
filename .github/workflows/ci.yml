name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: tailortex
          POSTGRES_PASSWORD: tailortex
          POSTGRES_DB: tailortex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tailortex" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TAILORTEX_TEST_DATABASE_URL: postgresql+asyncpg://tailortex:tailortex@localhost:5432/tailortex_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install TeX Live and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended lmodern cm-super poppler-utils
      - run: pip install -r backend/requirements-dev.txt
      - name: Tests (including real LaTeX compiles)
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npx tsc -b
      - run: npx oxlint src
      - run: npx vite build
